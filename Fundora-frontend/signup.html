d attendance, family and income, category and background, documents you have. Save and come back any time.`},matches:{title:`See your matches`,body:`Every scheme is sorted into Eligible, Almost eligible or Not eligible, with a plain-language reason for each.`},apply:{title:`Apply on the official site`,body:`Open a scheme to see its documents, steps and deadline, then use the official link. Track it in Fundora and get reminders.`}}},results:{eyebrow:`Your results`,title:`Three clear answers, never a guess`,description:`Every result tells you why, so you know what to do next.`,items:{eligible:{title:`Eligible`,body:`You meet every rule. Check the documents and apply before the deadline.`,example:`“Your marks and income meet every rule.”`},almost:{title:`Almost eligible`,body:`You are close on one or two things like income, marks or attendance. We show how close, so you can check with the scheme or your college.`,example:`“Your attendance is 3% below the 75% minimum.”`},not:{title:`Not eligible`,body:`A key rule does not match, such as course, state or category. You still see why, so you do not waste time.`,example:`“This scheme is only for law students.”`}}},features:{eyebrow:`Features`,title:`Everything you need to find and keep funding`,description:`Built for students who are short on time and tired of missing deadlines.`,items:{oneProfile:{title:`One profile, every scheme`,body:`Answer once. We check you against every scheme in our database, and re-check when you update.`},reasons:{title:`Plain-language reasons`,body:`No jargon. Each result says exactly which rule you meet or miss, in rupees and percentages.`},details:{title:`Clear scheme pages`,body:`Amount, deadline, documents needed, step-by-step instructions and the official link, all on one page.`},tracker:{title:`Application tracker`,body:`Move each scheme through Saved, Applying, Applied, Awarded and Renewal due, so nothing slips.`},reminders:{title:`Deadline reminders`,body:`Email reminders 14, 7 and 1 day before a saved deadline, plus renewal reminders every year.`},verified:{title:`Verified sources`,body:`Every scheme shows its official source and the date we last checked it. Old data is flagged.`},guides:{title:`Step-by-step guides`,body:`Simple guides for National Scholarship Portal sign-up, Aadhaar–bank seeding and getting certificates.`},counsellor:{title:`Help from your counsellor`,body:`Link with your college counsellor or an NGO for guidance. They see your matches only if you accept.`},language:{title:`Works on any phone`,body:`Light and fast on slow networks. English today, with Kannada and Hindi on the way.`}}},coverage:{eyebrow:`What we cover`,title:`More than scholarships`,description:`Fundora lists every kind of support an undergraduate can get, from central and state governments and private foundations.`,typesLabel:`Types of support`,types:{scholarships:`Scholarships`,loans:`Education loans`,waivers:`Fee waivers`,laptop:`Laptops and books`,hostel:`Hostel and travel`,coaching:`Coaching support`,girls:`Schemes for girls`,disability:`Schemes for students with disabilities`,rural:`Schemes for rural students`},coursesTitle:`19 undergraduate course categories`,coursesBody:`Engineering, medicine, nursing, pharmacy, arts, science, commerce, law, management, design, agriculture and more.`,rolloutTitle:`Growing state by state`,rolloutBody:`We start with central government and Karnataka schemes, then add other states as each one is verified.`},prepare:{eyebrow:`Before you start`,title:`Keep these handy`,description:`You don't upload anything to Fundora. We only ask whether you have each document, so we can tell you what's missing for a scheme.`,checklistLabel:`Documents most schemes ask for`,documents:{marks:`Latest marks cards or grade sheets`,income:`Family income certificate`,caste:`Caste or category certificate, if it applies to you`,disability:`Disability certificate, if it applies to you`,domicile:`Domicile or residence certificate`,bonafide:`College bonafide certificate and fee receipt`,bank:`A bank account seeded with your Aadhaar`,photo:`A recent passport-size photo`},tipsLabel:`Tips for better results`,tips:{email:`Use an email you check often. Reminders go there.`,exact:`Enter income and marks exactly as on your certificates.`,update:`Update your profile every year. Renewals depend on attendance and CGPA.`,confirm:`Always read the rules on the official site before you submit.`}},safety:{eyebrow:`Safety and privacy`,title:`Your data stays yours`,description:`Scholarship scams are common. Here is exactly what Fundora will and will not do.`,neverTitle:`Fundora will never`,never:{fee:`Charge you a fee of any kind`,password:`Ask for portal passwords or OTPs`,ids:`Ask for your Aadhaar or bank account number`,submit:`Fill or submit application forms for you`},promiseTitle:`How we protect you`,promise:{encrypt:`Income, category and disability details are encrypted`,consent:`Counsellors see your profile only after you accept`,delete:`Delete your account and all your data at any time`,official:`Every apply button goes to the official website`},warningTitle:`Spot a scam`,warningBody:`If anyone using the Fundora name asks you for money, an OTP or a password, it is a scam. Do not pay, and report it to us.`},faq:{eyebrow:`FAQ`,title:`Questions students ask`,items:{free:{q:`Is Fundora really free?`,a:`Yes. Fundora is free for students and always will be. There is no premium plan and no fee to see your matches.`},apply:{q:`Does Fundora apply for me?`,a:`No. Fundora finds schemes and explains them. You apply yourself on the scheme's official website, using the link on each scheme page.`},accuracy:{q:`How accurate is “Eligible”?`,a:`Results come from the rules in each scheme's official notice, and every scheme shows when we last checked it. Rules can change, so always confirm on the official site before you submit.`},data:{q:`What information do I need to share?`,a:`Your course, marks, attendance, family income, category, state and a few yes/no questions. Sensitive details are encrypted. We never ask for Aadhaar, bank or ID numbers.`},almost:{q:`What should I do if I'm “Almost eligible”?`,a:`Read the reason. If it is a small gap, like attendance or marks, check the latest official rules or ask your college. Some schemes allow exceptions or update limits each year.`},who:{q:`Who can use Fundora?`,a:`Any undergraduate student in India, across 19 course categories. We cover central and Karnataka schemes first and add more states over time.`},wrong:{q:`I found wrong information. What do I do?`,a:`Use the “Report wrong info” button on the scheme page. Our team checks every report against the official source.`},language:{q:`Is Fundora available in my language?`,a:`Fundora is in English today. Kannada and Hindi are coming next.`}}},cta:{title:`Your next scholarship might be one you've never heard of.`,body:`Create your free profile and see your matches today.`,primary:`Sign up free`,secondary:`Log in`},footer:{tagline:`Every scholarship you qualify for, in one place.`,product:`Product`,help:`Help`,legal:`Legal`,browse:`Browse schemes`,guides:`Guides`,privacy:`Privacy policy`,terms:`Terms of use`,builtBy:`Built by students at BMS College of Engineering, Bengaluru.`,disclaimer:`Fundora is an independent student project and is not affiliated with any government body. Always confirm scheme details on the official website before applying.`,copyright:`© {{year}} Fundora`},auth:{modeLabel:`Log in or create an account`,loginTab:`Log in`,signupTab:`Create account`,safety:`Fundora will never ask for your OTP or scholarship portal passwords.`,panel:{title:`Every scholarship you qualify for, in one place.`,body:`Fill one profile and see where you stand on every scheme, with a reason for each result.`,illustration:`A student at a desk checking scholarship results on a laptop`},email:{label:`Email`,placeholder:`you@college.edu`,suggestion:`Did you mean {{email}}?`,useSuggestion:`Yes, use it`,keepMine:`No, keep mi
